apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
  labels:
    app: expense-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      containers:
        - name: expense-tracker
          image: hruthingali/expensetracker:8
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: "expensetracker-db.cezwwc8au2kj.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "expensetracker"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "password123"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
