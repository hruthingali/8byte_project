apiVersion: v1
kind: Service
metadata:
  name: expense-tracker-service
  labels:
    app: expense-tracker
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: expense-tracker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
